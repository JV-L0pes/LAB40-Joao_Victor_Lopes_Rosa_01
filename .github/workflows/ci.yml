name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade (lint, testes e auditoria)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalação reproduzível
        run: npm ci

      - name: Análise estática (ESLint)
        run: npm run lint

      - name: Testes automatizados
        run: npm test

      - name: Auditoria de dependências
        run: npm run audit

      - name: Smoke test HTTP
        run: npm run test:smoke

  imagem:
    name: Build e execução do container
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build --pull -t lab40:feature20 .

      - name: Sobe o container e valida os endpoints
        run: |
          docker run -d --name lab40-ci -p 3000:3000 lab40:feature20
          for tentativa in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health
          curl -fsS -X POST http://localhost:3000/api/features/20 \
            -H "Content-Type: application/json" -d '{"valores":[1,2,2,3,1]}'
          curl -sS -o /dev/null -w "status_entrada_invalida=%{http_code}\n" \
            -X POST http://localhost:3000/api/features/20 \
            -H "Content-Type: application/json" -d '{"valores":"1,2"}'

      - name: Logs do container
        if: always()
        run: docker logs lab40-ci

      - name: Exporta a imagem como artefato
        if: always()
        run: |
          mkdir -p dist
          docker save lab40:feature20 -o dist/lab40-feature20.tar

      - name: Publica o artefato da imagem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab40-image-ci
          path: dist/lab40-feature20.tar
          retention-days: 7
